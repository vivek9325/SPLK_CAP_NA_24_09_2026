# ------------------------------------------------------------------
# NovaMart - Universal Forwarder inputs.conf (REFERENCE / Module 3)
# Location on the forwarder:
#   Linux  : /opt/splunkforwarder/etc/system/local/inputs.conf
#            (or better: inside a deployment app, e.g. etc/apps/nm_inputs/local/)
#   Windows: C:\Program Files\SplunkUniversalForwarder\etc\system\local\
# ------------------------------------------------------------------

[default]
host = $decideOnStartup

# Web tier - Apache/NGINX access logs (one file per web server)
[monitor:///var/log/novamart/web/*_access.log]
index = novamart
sourcetype = access_combined
disabled = false

# Application tier - order / payment / cart / auth services
[monitor:///var/log/novamart/app/order_service.log]
index = novamart
sourcetype = novamart:app
disabled = false

# Payment gateway JSON events
[monitor:///var/log/novamart/payment/payment_gateway.json]
index = novamart
sourcetype = novamart:payment
disabled = false

# Bastion host authentication log
[monitor:///var/log/secure]
index = novamart
sourcetype = linux_secure
disabled = false

# Network data: firewall syslog over UDP (normally on a dedicated syslog server/SC4S)
[udp://5514]
index = novamart
sourcetype = novamart:firewall
connection_host = ip
disabled = false
