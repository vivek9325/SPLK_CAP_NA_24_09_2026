# ------------------------------------------------------------------
# NovaMart - Universal Forwarder outputs.conf (REFERENCE / Module 3)
# Sends data to the indexer(s) on the Splunk receiving port 9997.
# Enable receiving on the indexer first:
#   Settings > Forwarding and receiving > Configure receiving > New > 9997
# ------------------------------------------------------------------
[tcpout]
defaultGroup = novamart_indexers

[tcpout:novamart_indexers]
server = idx01.novamart.local:9997, idx02.novamart.local:9997
# useACK = true        # enable indexer acknowledgement for guaranteed delivery
