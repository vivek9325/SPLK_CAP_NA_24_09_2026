# ------------------------------------------------------------------
# NovaMart - props.conf (REFERENCE / Modules 3 and 5)
# Parsing-time settings belong on the indexer (or heavy forwarder);
# search-time settings (EXTRACT-, EVAL-, LOOKUP-) belong on the search head.
# ------------------------------------------------------------------

[novamart:app]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 10000
KV_MODE = auto
# search-time field extractions (Module 5)
EXTRACT-log_level_service = ^\S+\s+(?<log_level>[A-Z]+)\s+\[(?<service>[^\]]+)\]
EXTRACT-gw_timeout = gateway (?<gateway>\S+) timed out after (?<timeout_ms>\d+) ms for order (?<order_id>ORD-\d+)
EVAL-response_sec = round(response_ms/1000, 2)

[novamart:payment]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z

[linux_secure]
# syslog timestamps carry no year and no time zone - declare the zone of the source
TZ = Asia/Kolkata

[novamart:firewall]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^<\d+>
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 35
KV_MODE = auto
